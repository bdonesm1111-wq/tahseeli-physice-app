<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة درجات الطالبات والاختبارات</title>
  <!-- مكتبة الأشكال الرسم البياني -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --primary: #4F46E5;
      --primary-hover: #4338CA;
      --bg: #F9FAFB;
      --card-bg: #FFFFFF;
      --text: #1F2937;
      --border: #E5E7EB;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      margin-bottom: 25px;
    }

    .card {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }

    .table-responsive {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }

    th, td {
      border: 1px solid var(--border);
      padding: 10px 14px;
      text-align: center;
    }

    th {
      background-color: #F3F4F6;
      font-weight: 600;
    }

    .chart-container {
      position: relative;
      height: 320px;
      width: 100%;
    }

    .badge {
      padding: 4px 8px;
      border-radius: 6px;
      font-weight: bold;
      background-color: #EEF2FF;
      color: var(--primary);
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>لوحة متابعة درجات الطالبات والأداء</h1>
  </div>

  <!-- خانة التحليل البياني للفصول (تظهر للزائر وللجميع) -->
  <div class="card">
    <h3 style="text-align: center; margin-top: 0;">📊 مقارنة وترتيب الفصول بيائياً</h3>
    <div class="chart-container">
      <canvas id="publicClassChart"></canvas>
    </div>
  </div>

  <!-- جدول الدرجات الكلية للجميع -->
  <div class="card">
    <h3>📋 كشف درجات الطالبات</h3>
    <div class="table-responsive">
      <table id="scoresTable">
        <thead>
          <tr id="tableHeader">
            <th>الاسم</th>
            <th>الفصل</th>
            <th>المجموع الكلي</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <!-- سيتم تحميل البيانات هنا تلقائياً -->
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
  // 1. تحميل وترسيم الرسم البياني للفصول
  async function loadClassAnalytics() {
    try {
      const res = await fetch('/api/analytics/classes');
      const data = await res.json();
      
      if (!data.classComparison || data.classComparison.length === 0) return;

      const labels = data.classComparison.map(c => 'فصل ' + c.class_name);
      const averages = data.classComparison.map(c => c.average_score ? parseFloat(c.average_score.toFixed(1)) : 0);

      const ctx = document.getElementById('publicClassChart').getContext('2d');
      new Chart(ctx, {
        type: 'bar',
        data: {
          labels: labels,
          datasets: [{
            label: 'متوسط درجات الفصل',
            data: averages,
            backgroundColor: [
              'rgba(79, 70, 229, 0.85)',
              'rgba(16, 185, 129, 0.85)',
              'rgba(245, 158, 11, 0.85)',
              'rgba(239, 68, 68, 0.85)'
            ],
            borderRadius: 8
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            y: { beginAtZero: true, title: { display: true, text: 'متوسط الدرجة' } }
          }
        }
      });
    } catch (err) {
      console.error("خطأ في جلب التحليل البياني:", err);
    }
  }

  // 2. تحميل كشف الطالبات والمجموع الكلي
  async function loadTableData() {
    try {
      const res = await fetch('/api/data');
      const data = await res.json();

      const headerRow = document.getElementById('tableHeader');
      const tableBody = document.getElementById('tableBody');

      // إضافة أعمدة الاختبارات إن وجدت
      data.tests.forEach(test => {
        const th = document.createElement('th');
        th.textContent = test.name;
        headerRow.insertBefore(th, headerRow.lastElementChild);
      });

      // عرض درجات الطالبات والمجموع
      tableBody.innerHTML = '';
      data.leaderboard.forEach(student => {
        let tr = document.createElement('tr');
        
        let html = `<td>${student.name}</td><td>${student.class_name}</td>`;
        
        data.tests.forEach(test => {
          const score = student.scoresMap[test.id];
          html += `<td>${score !== undefined ? score : '-'}</td>`;
        });

        html += `<td><span class="badge">${student.total}</span></td>`;
        tr.innerHTML = html;
        tableBody.appendChild(tr);
      });

    } catch (err) {
      console.error("خطأ في جلب الجدول:", err);
    }
  }

  document.addEventListener('DOMContentLoaded', () => {
    loadClassAnalytics();
    loadTableData();
  });
</script>

</body>
</html>
