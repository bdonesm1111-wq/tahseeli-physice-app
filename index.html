<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تحدي التحصيلي فيزياء٢</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap">
  <style>
    * { box-sizing: border-box; font-family: 'Tajawal', sans-serif; }
    body { background-color: #f4f6f9; margin: 0; padding: 15px; color: #333; }
    .container { max-width: 900px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
    h1 { text-align: center; color: #2c3e50; margin-bottom: 20px; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
    select, input, textarea, button { padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
    button { background: #3498db; color: #fff; border: none; cursor: pointer; transition: 0.2s; }
    button:hover { background: #2980b9; }
    .admin-btn { background: #e67e22; }
    .admin-panel { background: #f8f9fa; border: 1px solid #e9ecef; padding: 15px; border-radius: 8px; margin-bottom: 20px; display: none; }
    .admin-panel.active { display: block; }
    .import-box { margin-top: 15px; border-top: 1px solid #ddd; padding-top: 15px; }
    textarea { width: 100%; height: 100px; resize: vertical; margin-top: 5px; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; overflow-x: auto; display: block; }
    th, td { border: 1px solid #eee; padding: 10px; text-align: center; min-width: 80px; }
    th { background-color: #f1f3f5; }
    .rank-1 { background-color: #fff9db; font-weight: bold; }
    .rank-2 { background-color: #f1f3f5; font-weight: bold; }
    .rank-3 { background-color: #fff4e6; font-weight: bold; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🏆 تحدي التحصيلي - فيزياء ٢ 🏆</h1>
    
    <div class="top-bar">
      <div>
        <label>تصفية حسب الفصل: </label>
        <select id="classFilter" onchange="loadData()">
          <option value="الكل">جميع الفصول</option>
          <option value="أ">فصل أ</option>
          <option value="ب">فصل ب</option>
          <option value="ج">فصل ج</option>
          <option value="د">فصل د</option>
        </select>
      </div>
      <button class="admin-btn" onclick="toggleAdmin()">لوحة التحكم (الأدمن)</button>
    </div>

    <!-- لوحة التحكم -->
    <div id="adminPanel" class="admin-panel">
      <h3>🔐 إدارة البيانات</h3>
      <div id="loginForm">
        <input type="password" id="adminPass" placeholder="كلمة المرور">
        <button onclick="login()">دخول</button>
      </div>
      <div id="adminControls" style="display:none;">
        <button onclick="logout()" style="background:#e74c3c;">تسجيل الخروج</button>
        <hr>
        <h4>استيراد أسماء الطالبات دفعة واحدة من Excel:</h4>
        <p style="font-size: 12px; color: #666;">اختر الفصل، ثم انسخ العمود من Excel والصقه هنا (اسم الطالبة في كل سطر):</p>
        <select id="importClass">
          <option value="أ">فصل أ</option>
          <option value="ب">فصل ب</option>
          <option value="ج">فصل ج</option>
          <option value="د">فصل د</option>
        </select>
        <textarea id="importNames" placeholder="أدخل الأسماء هنا... كل اسم في سطر مستقل"></textarea>
        <button onclick="importStudents()">استيراد الأسماء الآن</button>

        <hr>
        <h4>إضافة اختبار جديد:</h4>
        <input type="text" id="testName" placeholder="اسم الاختبار">
        <button onclick="addTest()">إضافة اختبار</button>
      </div>
    </div>

    <!-- جدول الصدارة -->
    <table id="leaderboard">
      <thead>
        <tr id="headerRow">
          <th>الترتيب</th>
          <th>اسم الطالبة</th>
          <th>الفصل</th>
          <th>المجموع</th>
          <th>المتوسط</th>
        </tr>
      </thead>
      <tbody id="bodyRows"></tbody>
    </table>
  </div>

  <script>
    let isAdmin = false;
    let currentData = null;

    async function checkAuth() {
      const res = await fetch('/api/auth-check');
      const data = await res.json();
      isAdmin = data.isAdmin;
      document.getElementById('loginForm').style.display = isAdmin ? 'none' : 'block';
      document.getElementById('adminControls').style.display = isAdmin ? 'block' : 'none';
      loadData();
    }

    function toggleAdmin() {
      const panel = document.getElementById('adminPanel');
      panel.classList.toggle('active');
    }

    async function login() {
      const password = document.getElementById('adminPass').value;
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password })
      });
      if (res.ok) {
        checkAuth();
      } else {
        alert('كلمة المرور خاطئة');
      }
    }

    async function logout() {
      await fetch('/api/logout', { method: 'POST' });
      checkAuth();
    }

    async function importStudents() {
      const className = document.getElementById('importClass').value;
      const rawText = document.getElementById('importNames').value;
      const names = rawText.split('\n').map(n => n.trim()).filter(n => n.length > 0);

      if (names.length === 0) return alert('الرجاء إدخال أسماء أولاً');

      const res = await fetch('/api/students/bulk', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ class_name: className, names })
      });

      if (res.ok) {
        alert('تم استيراد الأسماء بنجاح!');
        document.getElementById('importNames').value = '';
        loadData();
      } else {
        alert('حدث خطأ أثناء الاستيراد');
      }
    }

    async function addTest() {
      const name = document.getElementById('testName').value;
      if (!name) return alert('ادخل اسم الاختبار');
      await fetch('/api/tests', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name })
      });
      document.getElementById('testName').value = '';
      loadData();
    }

    async function updateScore(student_id, test_id, score) {
      await fetch('/api/scores', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ student_id, test_id, score })
      });
      loadData();
    }

    async function loadData() {
      const res = await fetch('/api/data');
      currentData = await res.json();
      renderTable();
    }

    function renderTable() {
      if (!currentData) return;
      const filter = document.getElementById('classFilter').value;
      let list = currentData.leaderboard;
      if (filter !== 'الكل') list = list.filter(s => s.class_name === filter);

      list.sort((a, b) => b.total - a.total);

      const headerRow = document.getElementById('headerRow');
      headerRow.innerHTML = `<th>الترتيب</th><th>اسم الطالبة</th><th>الفصل</th>`;
      currentData.tests.forEach(t => {
        headerRow.innerHTML += `<th>${t.name}</th>`;
      });
      headerRow.innerHTML += `<th>المجموع</th><th>المتوسط</th>`;

      const tbody = document.getElementById('bodyRows');
      tbody.innerHTML = '';

      list.forEach((st, idx) => {
        let badge = idx === 0 ? '🥇 ' : idx === 1 ? '🥈 ' : idx === 2 ? '🥉 ' : '';
        let rowClass = idx === 0 ? 'rank-1' : idx === 1 ? 'rank-2' : idx === 2 ? 'rank-3' : '';
        
        let row = `<tr class="${rowClass}">
          <td>${badge}${idx + 1}</td>
          <td>${st.name}</td>
          <td>${st.class_name}</td>`;

        currentData.tests.forEach(t => {
          let score = st.scoresMap[t.id] !== undefined ? st.scoresMap[t.id] : '';
          if (isAdmin) {
            row += `<td><input type="number" style="width:60px;" value="${score}" onchange="updateScore(${st.id}, ${t.id}, this.value)"></td>`;
          } else {
            row += `<td>${score !== '' ? score : '-'}</td>`;
          }
        });

        row += `<td><b>${st.total}</b></td><td>${st.avg}</td></tr>`;
        tbody.innerHTML += row;
      });
    }

    checkAuth();
  </script>
</body>
</html>
