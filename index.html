<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة متابعة درجات الطالبات والأداء</title>
  <!-- مكتبة الرسم البياني -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --primary: #4F46E5;
      --primary-hover: #4338CA;
      --bg: #F9FAFB;
      --card-bg: #FFFFFF;
      --text: #1F2937;
      --border: #E5E7EB;
      --danger: #EF4444;
      --success: #10B981;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      flex-wrap: wrap;
      gap: 15px;
    }

    .header h1 {
      margin: 0;
      font-size: 1.6rem;
    }

    .card {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }

    .btn {
      padding: 8px 16px;
      border-radius: 8px;
      border: none;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-danger { background: var(--danger); color: white; }

    .admin-panel {
      display: none;
      background: #EEF2FF;
      border: 2px dashed var(--primary);
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 25px;
    }

    .form-group {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
      flex-wrap: wrap;
    }

    input, select {
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.95rem;
      flex: 1;
      min-width: 150px;
    }

    .table-responsive {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }

    th, td {
      border: 1px solid var(--border);
      padding: 10px 14px;
      text-align: center;
    }

    th {
      background-color: #F3F4F6;
      font-weight: 600;
    }

    .chart-container {
      position: relative;
      height: 320px;
      width: 100%;
    }

    .badge {
      padding: 4px 8px;
      border-radius: 6px;
      font-weight: bold;
      background-color: #EEF2FF;
      color: var(--primary);
    }

    .no-data-msg {
      text-align: center;
      color: #9CA3AF;
      padding: 40px 0;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>

<div class="container">
  
  <!-- الهيدر أوفيس -->
  <div class="header">
    <h1>لوحة متابعة درجات الطالبات والأداء</h1>
    <div>
      <button id="loginBtn" class="btn btn-primary" onclick="toggleLogin()">🔑 دخول الإدارة</button>
      <button id="logoutBtn" class="btn btn-danger" onclick="logout()" style="display: none;">تسجيل الخروج</button>
    </div>
  </div>

  <!-- لوحة تحكم لوحة الإدارة (تظهر عند إدخال كلمة المرور) -->
  <div id="adminPanel" class="admin-panel">
    <h3 style="margin-top: 0; color: var(--primary);">⚙️ لوحة تحكم المعلمة والإدارة</h3>
    
    <!-- 1. إضافة طالبة -->
    <div class="form-group">
      <input type="text" id="studentName" placeholder="اسم الطالبة الكامل">
      <input type="text" id="studentClass" placeholder="الفصل (مثال: 1/3)">
      <button class="btn btn-primary" onclick="addStudent()">إضافة طالبة</button>
    </div>

    <!-- 2. إضافة اختبار -->
    <div class="form-group">
      <input type="text" id="testName" placeholder="اسم الاختبار الجديد">
      <button class="btn btn-primary" onclick="addTest()">إضافة اختبار</button>
    </div>

    <!-- 3. رصد درجة -->
    <div class="form-group">
      <select id="selectStudent"><option value="">اختر الطالبة...</option></select>
      <select id="selectTest"><option value="">اختر الاختبار...</option></select>
      <input type="number" id="scoreInput" placeholder="الدرجة" step="0.5">
      <button class="btn btn-primary" onclick="submitScore()">رصد الدرجة</button>
    </div>
  </div>

  <!-- خانة التحليل البياني للفصول -->
  <div class="card">
    <h3 style="text-align: center; margin-top: 0;">📊 مقارنة وترتيب الفصول بيائياً</h3>
    <div class="chart-container" id="chartBox">
      <canvas id="publicClassChart"></canvas>
    </div>
  </div>

  <!-- جدول الدرجات الكلية للجميع -->
  <div class="card">
    <h3>📋 كشف درجات الطالبات</h3>
    <div class="table-responsive">
      <table id="scoresTable">
        <thead>
          <tr id="tableHeader">
            <th>الاسم</th>
            <th>الفصل</th>
            <th>المجموع الكلي</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <!-- سيتم تحميل البيانات هنا تلقائياً -->
        </tbody>
      </table>
    </div>
  </div>

</div>

<script>
  const ADMIN_PASS = 'admins123';
  let isAdmin = false;
  let chartInstance = null;

  // تسجيل الدخول للإدارة
  function toggleLogin() {
    if (isAdmin) return;
    const pass = prompt('يرجى إدخال كلمة مرور الإدارة:');
    if (pass === ADMIN_PASS) {
      isAdmin = true;
      document.getElementById('adminPanel').style.display = 'block';
      document.getElementById('loginBtn').style.display = 'none';
      document.getElementById('logoutBtn').style.display = 'inline-block';
      alert('تم تسجيل الدخول بنجاح!');
    } else if (pass !== null) {
      alert('كلمة المرور غير صحيحة!');
    }
  }

  function logout() {
    isAdmin = false;
    document.getElementById('adminPanel').style.display = 'none';
    document.getElementById('loginBtn').style.display = 'inline-block';
    document.getElementById('logoutBtn').style.display = 'none';
  }

  // 1. تحميل وترسيم الرسم البياني للفصول
  async function loadClassAnalytics() {
    try {
      const res = await fetch('/api/analytics/classes');
      if (!res.ok) throw new Error("تعذر الجلب من الخادم");
      
      const data = await res.json();
      const chartBox = document.getElementById('chartBox');

      if (!data.classComparison || data.classComparison.length === 0) {
        chartBox.innerHTML = '<div class="no-data-msg">لا توجد بيانات فصول أو درجات مسجلة حالياً لعرض الرسم البياني</div>';
        return;
      }

      // إرجاع خيار الـ Canvas في حال كان قد استبدل بالنص
      chartBox.innerHTML = '<canvas id="publicClassChart"></canvas>';

      const labels = data.classComparison.map(c => 'فصل ' + c.class_name);
      const averages = data.classComparison.map(c => c.average_score ? parseFloat(Number(c.average_score).toFixed(1)) : 0);

      const ctx = document.getElementById('publicClassChart').getContext('2d');
      if (chartInstance) chartInstance.destroy();

      chartInstance = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: labels,
          datasets: [{
            label: 'متوسط درجات الفصل',
            data: averages,
            backgroundColor: [
              'rgba(79, 70, 229, 0.85)',
              'rgba(16, 185, 129, 0.85)',
              'rgba(245, 158, 11, 0.85)',
              'rgba(239, 68, 68, 0.85)'
            ],
            borderColor: [
              '#4F46E5',
              '#10B981',
              '#F59E0B',
              '#EF4444'
            ],
            borderWidth: 1,
            borderRadius: 8
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            y: { beginAtZero: true, title: { display: true, text: 'متوسط الدرجات' } }
          }
        }
      });
    } catch (err) {
      console.error("خطأ في جلب التحليل البياني:", err);
    }
  }

  // 2. تحميل كشف الطالبات والجدول
  async function loadTableData() {
    try {
      const res = await fetch('/api/data');
      const data = await res.json();

      const headerRow = document.getElementById('tableHeader');
      const tableBody = document.getElementById('tableBody');
      const studentSelect = document.getElementById('selectStudent');
      const testSelect = document.getElementById('selectTest');

      headerRow.innerHTML = '<th>الاسم</th><th>الفصل</th><th>المجموع الكلي</th>';
      studentSelect.innerHTML = '<option value="">اختر الطالبة...</option>';
      testSelect.innerHTML = '<option value="">اختر الاختبار...</option>';

      // تعبئة قائمة الاختبارات
      if (data.tests && data.tests.length > 0) {
        data.tests.forEach(test => {
          const th = document.createElement('th');
          th.textContent = test.name;
          headerRow.insertBefore(th, headerRow.lastElementChild);

          const opt = document.createElement('option');
          opt.value = test.id;
          opt.textContent = test.name;
          testSelect.appendChild(opt);
        });
      }

      // تعبئة الجدول وقائمة الطالبات
      tableBody.innerHTML = '';
      if (data.leaderboard && data.leaderboard.length > 0) {
        data.leaderboard.forEach(student => {
          // إضافة للقائمة المنسدلة
          const opt = document.createElement('option');
          opt.value = student.id;
          opt.textContent = `${student.name} (${student.class_name})`;
          studentSelect.appendChild(opt);

          // صف الجدول
          let tr = document.createElement('tr');
          let html = `<td>${student.name}</td><td>${student.class_name}</td>`;
          
          if (data.tests) {
            data.tests.forEach(test => {
              const score = student.scoresMap ? student.scoresMap[test.id] : undefined;
              html += `<td>${score !== undefined ? score : '-'}</td>`;
            });
          }

          html += `<td><span class="badge">${student.total || 0}</span></td>`;
          tr.innerHTML = html;
          tableBody.appendChild(tr);
        });
      }
    } catch (err) {
      console.error("خطأ في جلب البيانات:", err);
    }
  }

  // إضافات الإدارة
  async function addStudent() {
    const name = document.getElementById('studentName').value.trim();
    const class_name = document.getElementById('studentClass').value.trim();
    if (!name || !class_name) return alert('يرجى تعبئة جميع الحقول');

    await fetch('/api/students', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ name, class_name })
    });

    document.getElementById('studentName').value = '';
    document.getElementById('studentClass').value = '';
    refreshAll();
  }

  async function addTest() {
    const name = document.getElementById('testName').value.trim();
    if (!name) return alert('اسم الاختبار مطلوب');

    await fetch('/api/tests', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ name })
    });

    document.getElementById('testName').value = '';
    refreshAll();
  }

  async function submitScore() {
    const student_id = document.getElementById('selectStudent').value;
    const test_id = document.getElementById('selectTest').value;
    const score = parseFloat(document.getElementById('scoreInput').value);

    if (!student_id || !test_id || isNaN(score)) return alert('يرجى تعبئة جميع البيانات بشكل صحيح');

    await fetch('/api/scores', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ student_id, test_id, score })
    });

    document.getElementById('scoreInput').value = '';
    refreshAll();
  }

  function refreshAll() {
    loadClassAnalytics();
    loadTableData();
  }

  document.addEventListener('DOMContentLoaded', () => {
    refreshAll();
  });
</script>

</body>
</html>
